# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/alpr"
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It opens the cameras: RTSP, RTSPS, HTTP and HTTPS streams, each address checked to be public
# before every connection unless the installer allows private ones.
network = true
# It reads the models and the TensorRT calibration tables, and writes the compiled engines to
# their cache directory.
filesystem = true
# It runs ffmpeg and ffprobe, one ffmpeg per camera, with a protocol whitelist.
exec = true
# It owns no table.
migrations = false
